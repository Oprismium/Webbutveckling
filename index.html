            <li>
                <div class="theme-container">
                    <button id="theme-toggle">Ändra Tema</button>

                        <button class="theme-option" data-theme="world">World</button>
                        <button class="theme-option" data-theme="twilight">Twilight</button>

                    <div class="sidebar-section">

                        <label>Time of Day</label>
                        <input id="timeOfDay" type="range" min="0" max="23" value="12">

                        <label>Season</label>
                        <select id="seasonSelect">
                            <option value="winter">Winter</option>
                            <option value="spring" selected>Spring</option>
                            <option value="summer">Summer</option>
                            <option value="autumn">Autumn</option>
                        </select>

                        <label>Cloud</label>
                        <select id="cloudSelect">
                            <option value="clear" selected>Clear</option>
                            <option value="cloudy">Cloudy</option>
                            <option value="overcast">Overcast</option>
                        </select>

                        <label>Precipitation</label>
                        <select id="precipSelect">
                            <option value="none" selected>None</option>
                            <option value="rain">Rain</option>
                            <option value="snow">Snow</option>
                        </select>

                    </div>
